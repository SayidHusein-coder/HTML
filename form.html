<html>
    <head>
        <title>
            Prakek Form
        </title>
    </head>
    <h2>Form Pendaftaran SPMB</h2>
    <form>
        <table> 
            <tr>
                <td><label>Nama Lengkap</label></td>
                <td>:</td>
                <td><input type="text" required placeholder="masukkan nama lengkap"></td>
            </tr>
            <tr>
                <td>No HP</td>
                <td>:</td>
                <td><input type="number" required placeholder="masukkan no HP"></td>
            </tr>
            <tr>
                <td>Tanggal lahir</td>
                <td>:</td>
                <td><input type="date"></td>
            </tr>
            <tr>
                <td>Email</td>
                <td>:</td>
                <td><input type="email" ></td>
            </tr>
            <tr>
                <td>Jenis Kelamin</td>
                <td>:</td>
                <td>
                    <input type="radio" name="jk" value="laki-laki">Laki-laki
                </td>
                <tr>
                    <td></td>
                    <td></td>
                    <td><input type="radio" name="jk" value="perempuan">Perempuan</td>
                </tr>
            </tr>
            <tr>
                <td><label>Sub Organ</label></td>
                <td>:</td>
                <td><input type="checkbox" name="suborgan" value="">MAC<br></td>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td><input type="checkbox" name="suborgan" value="">MEMO<br></td>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td><input type="checkbox" name="suborgan" value="">PASKATEMA<br></td>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td><input type="checkbox" name="suborgan" value="">IRC<br></td>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td><input type="checkbox" name="suborgan" value="">METIC<br></td>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td><input type="checkbox" name="suborgan" value="">COMET<br></td>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td><input type="checkbox" name="suborgan" value="">Basket<br></td>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td><input type="checkbox" name="suborgan" value="">BDI<br></td>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td><input type="checkbox" name="suborgan" value="">PUSTEL<br></td>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td><input type="checkbox" name="suborgan" value="">PALWAGA<br></td>
            </tr>
            <tr>
                <td><label>Jurusan</label></td>
                <td>:</td>
                <td>
                    <select name="jurusan">
                        <option value="">Pilih Jurusan</option>
                        <option value="RPL">RPL</option>
                        <option value="TKJ">TKJ</option>
                        <option value="PG">PG</option>
                    </select>
            </tr>
            <tr>
                <td><label>Alamat</label></td>
                <td>:</td>
                <td><textarea placeholder="masukkan alamat"></textarea></td>
            </tr>
            <tr>
                <td><label>Upload Foto</label></td>
                <td>:</td>
                <td><input type="file" name="foto"></td>
            </tr>
        </table>
<button type="submit">Submit</button>
    </form>
</html>
